# /etc/systemd/logind.conf.d/50-qnap-ts328.conf
#
# The power button comes from the MCU (qnap-mcu input, KEY_POWER) and only
# reports after it has been held for a while: power off, as QTS does.
#
# The rear reset button is KEY_RESTART (gpio-keys). Its active level comes
# from QTS model.conf and is not yet verified on hardware; a wrong level
# would look like a held key and logind would reboot right after boot.
# Ignore it until verified (see docs/HARDWARE.md).
[Login]
HandlePowerKey=poweroff
# A physical press wins over inhibitor locks (e.g. udisks blocks shutdown
# for the whole md resync; the write-intent bitmap makes stopping safe).
PowerKeyIgnoreInhibited=yes
HandleRebootKey=ignore
HandleRebootKeyLongPress=ignore
